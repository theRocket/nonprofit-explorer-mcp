[project]
name = "nonprofit-explorer-mcp"
version = "0.1.0"
description = "MCP server for ProPublica's Nonprofit Explorer API (IRS 990 nonprofit tax filing data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ryanrickerts/nonprofit-explorer-mcp"
"ProPublica API docs" = "https://projects.propublica.org/nonprofits/api"

[project.scripts]
nonprofit-explorer-mcp = "nonprofit_explorer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nonprofit_explorer_mcp"]
